<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 영화 티어리스트</title><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#433b42}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff7f9;background-image:radial-gradient(circle at 8% 12%,#f8c7d766 0 12px,transparent 13px),radial-gradient(circle at 12% 16%,#f8c7d766 0 9px,transparent 10px),radial-gradient(circle at 92% 22%,#e9c7ee77 0 15px,transparent 16px),radial-gradient(circle at 87% 26%,#e9c7ee77 0 10px,transparent 11px),radial-gradient(circle at 7% 88%,#f5d5a777 0 13px,transparent 14px),radial-gradient(circle at 93% 85%,#cce8d777 0 13px,transparent 14px),linear-gradient(135deg,#fff7f9,#fffdf7 52%,#f9f5ff)}main{width:min(1050px,calc(100% - 28px));margin:32px auto 60px}.panel{background:#ffffffdb;border:1px solid #fff;border-radius:22px;box-shadow:0 12px 35px #a5758a18;padding:24px;margin-bottom:20px}h1{text-align:center;margin:0 0 8px;color:#9d5776;font-size:clamp(24px,4vw,36px)}.sub{text-align:center;color:#8e7d88;margin:0 0 24px}h2{font-size:19px;margin:0 0 16px}form{display:flex;gap:9px;flex-wrap:wrap}input{flex:1;min-width:180px;border:1px solid #e6ccd7;border-radius:12px;padding:13px 15px;font-size:16px;background:white}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:11px 17px;background:#bd7394;color:white;font-weight:700}button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible{outline:3px solid #c18fb6;outline-offset:2px}.danger{background:#fff0f2;color:#a95366;border:1px solid #f1ccd3}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.hint{color:#82737c;font-size:13px}.tiers{display:grid;gap:9px}.tier{display:flex;min-height:95px;border-radius:13px;overflow:hidden;border:2px solid transparent;transition:border-color .15s,transform .15s}.tier.over,.pool.over{border-color:#ae7198;outline:2px dashed #ae7198;outline-offset:-7px}.tier-name{width:76px;flex:none;display:grid;place-items:center;font-size:28px;font-weight:900}.tier-body{flex:1;min-width:0;padding:12px;display:flex;align-items:center;align-content:center;flex-wrap:wrap;gap:9px}.S .tier-name{background:#f29aab}.S .tier-body{background:#fce8ed}.A .tier-name{background:#f3b56b}.A .tier-body{background:#fff0dc}.B .tier-name{background:#e5cd65}.B .tier-body{background:#fff8da}.C .tier-name{background:#8ccdb4}.C .tier-body{background:#e5f6ee}.D .tier-name{background:#9ebce8}.D .tier-body{background:#eaf1fc}.empty{color:#9a8e97;font-size:13px;pointer-events:none}.pool{min-height:130px;padding:14px;border:2px dashed #e6d0dc;border-radius:14px;display:flex;align-content:flex-start;flex-wrap:wrap;gap:10px;background:#fffafd}.card{background:white;border:1px solid #eadde4;border-radius:12px;padding:10px 11px;min-width:140px;max-width:230px;box-shadow:0 3px 9px #8b6a7a18;cursor:grab;touch-action:pan-y;user-select:none;position:relative;transition:box-shadow .15s,transform .15s}.card:active{cursor:grabbing}.card.dragging{opacity:.45}.card.selected{outline:3px solid #b778a0}.card-title{font-size:14px;font-weight:700;overflow-wrap:anywhere;padding-right:19px;margin-bottom:7px}.remove{position:absolute;right:5px;top:5px;background:transparent;color:#9c7889;padding:3px 7px;font-size:16px}.stars{display:flex;gap:2px}.star{padding:0 2px;background:transparent;color:#d8cbd0;font-size:21px;line-height:1.2}.star.on{color:#eab64c}.counter{font-size:13px;color:#917b87}.help{margin-top:12px;font-size:13px;color:#806e7a;line-height:1.6}.placeholder{width:4px;align-self:stretch;min-height:50px;background:#af79a0;border-radius:3px}footer{text-align:center;font-size:12px;color:#9d8a97}@media(max-width:560px){main{margin-top:14px}.panel{padding:15px}.tier-name{width:52px;font-size:23px}.tier-body{padding:8px}.card{min-width:120px;max-width:180px}.actions button{width:100%}}
</style></head><body><main><section class="panel"><h1>🌸 나의 영화 티어리스트</h1><p class="sub">좋아하는 영화를 나만의 순위로 정리해 보세요</p><form id="addForm"><input id="movieInput" aria-label="영화 제목" placeholder="영화 제목을 입력하세요" maxlength="100" required autocomplete="off"><button type="submit" id="addMovieButton">＋ 영화 추가</button></form><p id="notice" class="hint" role="status" aria-live="polite">영화 제목을 입력하면 아래 보관함에 추가돼요.</p><div class="actions"><span id="count" class="counter">등록된 영화 0편</span><button type="button" class="danger" id="reset">전체 초기화</button></div></section><section class="panel"><h2>🎬 영화 등급표</h2><div class="tiers" id="tiers"></div><p class="help">카드를 끌어서 등급을 옮기거나 같은 등급 안에서 순서를 바꿀 수 있어요. 터치 기기에서는 카드를 길게 눌러 이동하세요. 이동이 어려우면 카드를 한 번 선택한 다음 원하는 등급 또는 위치를 눌러 주세요.</p></section><section class="panel"><div class="actions"><h2>🧺 영화 보관함</h2><span class="hint">아직 등급을 정하지 않은 영화</span></div><div id="pool" class="pool" data-zone="pool" aria-label="영화 보관함"></div></section><footer>모든 영화 기록은 현재 브라우저에 자동 저장됩니다.</footer></main><script>
(function(){
'use strict';
var key='flower_movie_tiers_v2', ranks=['S','A','B','C','D'], movies=[], selected=null, dragged=null;
function el(id){return document.getElementById(id)}
function notice(msg){el('notice').textContent=msg}
function persist(){try{localStorage.setItem(key,JSON.stringify(movies))}catch(err){notice('영화는 추가됐지만 브라우저 저장이 제한되어 있어요.')}}
try{var old=JSON.parse(localStorage.getItem(key)||localStorage.getItem('flower_movie_tiers_v1')||'[]');if(Array.isArray(old))movies=old.filter(function(m){return m&&m.title&&m.id&&m.zone}).map(function(m){return {id:String(m.id),title:String(m.title),zone:m.zone,stars:(Number.isFinite(Number(m.stars))?Math.max(0,Math.min(5,Number(m.stars))):0)}})}catch(err){}
function make(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function add(title){title=title.trim().replace(/\s+/g,' ');if(!title){notice('영화 제목을 입력해 주세요.');return false}if(movies.some(function(m){return m.title.toLowerCase()===title.toLowerCase()})){notice('이미 등록된 영화예요.');return false}movies.push({id:String(Date.now())+'_'+Math.random().toString(36).slice(2),title:title,zone:'pool',stars:0});persist();draw();notice('✅ '+title+' 영화가 보관함에 추가됐어요.');el('pool').scrollIntoView({block:'center',behavior:'smooth'});return true}
function move(id,zone,before){var ix=movies.findIndex(function(m){return m.id===id});if(ix<0)return;var m=movies.splice(ix,1)[0];m.zone=zone;var at=before?movies.findIndex(function(x){return x.id===before}):-1;if(at<0)movies.push(m);else movies.splice(at,0,m);selected=null;persist();draw();notice('영화 위치를 변경했어요.')}
function card(m){var c=make('div','card'+(selected===m.id?' selected':''));c.draggable=true;c.dataset.id=m.id;c.tabIndex=0;var t=make('div','card-title',m.title),x=make('button','remove','×');x.type='button';x.title='삭제';x.onclick=function(ev){ev.stopPropagation();movies=movies.filter(function(a){return a.id!==m.id});persist();draw();notice('영화를 삭제했어요.')};var stars=make('div','stars');for(var i=1;i<=5;i++){(function(n){var b=make('button','star'+(n<=m.stars?' on':''),'★');b.type='button';b.title=n+'점 선택';b.onclick=function(ev){ev.stopPropagation();m.stars=n;persist();draw();notice('별점을 수정했어요.')};stars.appendChild(b)})(i)}c.appendChild(t);c.appendChild(x);c.appendChild(stars);c.onclick=function(){if(selected&&selected!==m.id)move(selected,m.zone,m.id);else{selected=selected===m.id?null:m.id;draw();notice(selected?'이동할 등급이나 카드를 클릭하세요.':'선택을 해제했어요.')}};c.ondragstart=function(ev){dragged=m.id;ev.dataTransfer.setData('text/plain',m.id)};c.ondragend=function(){dragged=null};return c}
function dropzone(node,zone){node.dataset.zone=zone;node.ondragover=function(ev){ev.preventDefault()};node.ondrop=function(ev){ev.preventDefault();ev.stopPropagation();var id=dragged||ev.dataTransfer.getData('text/plain');var target=ev.target.closest('.card');if(id)move(id,zone,target?target.dataset.id:null)};node.onclick=function(ev){if(selected&&!ev.target.closest('.card'))move(selected,zone,null)};var arr=movies.filter(function(m){return m.zone===zone});if(!arr.length)node.appendChild(make('span','empty',zone==='pool'?'영화를 추가하거나 이곳으로 옮겨 주세요':'영화를 이곳에 놓아 주세요'));arr.forEach(function(m){node.appendChild(card(m))})}
function draw(){var root=el('tiers');root.innerHTML='';ranks.forEach(function(rank){var row=make('div','tier '+rank),label=make('div','tier-name',rank),body=make('div','tier-body');dropzone(body,rank);row.appendChild(label);row.appendChild(body);root.appendChild(row)});var pool=el('pool');pool.innerHTML='';dropzone(pool,'pool');el('count').textContent='등록된 영화 '+movies.length+'편'}
var form=el('addForm');form.onsubmit=function(ev){ev.preventDefault();var input=el('movieInput');if(add(input.value)){input.value='';input.focus()}return false};el('addMovieButton').onclick=function(ev){ev.preventDefault();form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))};el('reset').onclick=function(){if(movies.length&&confirm('등록된 영화를 모두 삭제할까요?')){movies=[];persist();draw();notice('초기화했어요.')}};
window.addEventListener('error',function(e){notice('오류: '+e.message)});
draw();
})();
</script></body></html>
